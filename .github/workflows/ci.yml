name: CI

on:
  push:
    branches: [tauri-release, main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt + check + test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check
        run: cargo fmt -- --check

      - name: Compile check
        run: cargo check

      - name: Unit tests
        run: cargo test
  # E2E window interaction checks (scripts/e2e-check.mjs) intentionally
  # NOT part of CI: WebView2 requires an interactive desktop session,
  # which GitHub Actions Windows runners do not provide (the exe starts
  # but WebView2 never initializes). Run locally with `npm run e2e`.

  frontend:
    name: Frontend tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tests import Node builtins only, so this job skips npm ci. The
      # run also includes tests/syntax-check.test.mjs, which auto-discovers
      # renderer scripts and scripts/*.mjs instead of a hard-coded list.
      - name: Unit tests
        run: npm run test:frontend
