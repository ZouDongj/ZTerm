[package]
name = "zterm"
version = "1.1.0"
edition = "2021"
description = "ZTerm - A modern terminal emulator for Windows with SSH management"
authors = ["zoudongjie <zoudongjie96@163.com>"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
portable-pty = "0.8"
parking_lot = "0.12"
regex = "1"
russh = { version = "0.60", features = ["aws-lc-rs"] }
anyhow = "1"
winapi = { version = "0.3", features = ["dpapi", "minwindef", "ntdef", "shellapi", "winbase", "wincrypt", "wingdi", "winnt", "winreg", "winuser"] }
arboard = "3"
# Electron safeStorage compatibility (OSCrypt AES-GCM decryption)
aes-gcm = "0.10"
# Update check: one small JSON GET via the sync client + spawn_blocking, avoiding reqwest/hyper
ureq = { version = "3", features = ["json", "win-system-proxy"] }
# Update installer integrity check (sha256 of the downloaded setup exe).
# Already in the lockfile as an indirect dep; declared here for direct use.
sha2 = "0.10"
# Disable WebView2's built-in browser accelerator keys (Ctrl+F/P/R, F5, F12,
# Ctrl+J downloads popup, ...) via ICoreWebView2Settings3. Versions are pinned
# by the lockfile to the same ones wry 0.55 pulls in, so no tree changes.
webview2-com = "0.38"
windows-core = "0.61"

# portable-pty drives the local shell; output reaches the frontend over a Tauri Channel
# russh 0.60 re-exports russh_keys as russh::key, so no separate russh-keys dependency
