<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- V3:悬浮层次 —— 深色渐变底 + 高对比 Z 形窗格 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131624"/>
      <stop offset="1" stop-color="#0a0c12"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g fill="#f4f6ff">
    <!-- 顶行 -->
    <rect x="96"  y="96"  width="56" height="56" rx="12"/>
    <rect x="160" y="96"  width="56" height="56" rx="12"/>
    <rect x="224" y="96"  width="56" height="56" rx="12"/>
    <rect x="288" y="96"  width="56" height="56" rx="12"/>
    <rect x="352" y="96"  width="56" height="56" rx="12"/>
    <!-- 对角线 -->
    <rect x="288" y="160" width="56" height="56" rx="12"/>
    <rect x="224" y="224" width="56" height="56" rx="12"/>
    <rect x="160" y="288" width="56" height="56" rx="12"/>
    <!-- 底行 -->
    <rect x="96"  y="352" width="56" height="56" rx="12"/>
    <rect x="160" y="352" width="56" height="56" rx="12"/>
    <rect x="224" y="352" width="56" height="56" rx="12"/>
    <rect x="288" y="352" width="56" height="56" rx="12"/>
    <rect x="352" y="352" width="56" height="56" rx="12" fill="#8affa0"/>
  </g>
</svg>
