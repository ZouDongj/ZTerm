<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Depth &amp; Selection Preview · 阴影预算 + 统一选中系统</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #0a0a0d; color: #ccc; font-family: system-ui, sans-serif; padding: 24px; }
  h1 { font-size: 18px; color: #eee; margin-bottom: 6px; }
  p.desc { font-size: 13px; color: #999; margin-bottom: 14px; max-width: 980px; line-height: 1.6; }
  .schemes { display: flex; gap: 8px; margin-bottom: 18px; }
  .schemes button { padding: 6px 14px; border-radius: 8px; border: 1px solid #444; background: #1a1a22; color: #ccc; font-size: 13px; cursor: pointer; }
  .schemes button.on { border-color: #9CA3FF; color: #fff; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .col { flex: 1; min-width: 400px; }
  .col > h2 { font-size: 14px; margin: 14px 0 8px; }
  .col > h2:first-child { margin-top: 0; }
  .col h2 .tag { font-weight: 400; color: #888; font-size: 12px; }
  .win { border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); height: 300px; display: flex; flex-direction: column; }
  .titlebar { height: 28px; display: flex; align-items: center; padding: 0 10px; font-size: 11px; gap: 8px; }
  .titlebar .dot { width: 9px; height: 9px; border-radius: 50%; }
  .tabbar { height: 34px; display: flex; align-items: center; padding: 0 8px; gap: 4px; }
  .main { flex: 1; position: relative; }
  .term { position: absolute; inset: 10px; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11.5px; line-height: 1.55; padding: 10px; }
  .term .p { font-weight: 600; }
  /* sample strip: 选中/强调效果样例 */
  .strip { border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .chip { font-size: 12px; padding: 5px 12px; border-radius: 8px; cursor: default; display: inline-flex; align-items: center; gap: 6px; }
  .st-label { font-size: 11px; color: #777; width: 100%; margin-bottom: -2px; }
  .swatch { width: 20px; height: 20px; border-radius: 6px; }
  .dot-ind { width: 8px; height: 8px; border-radius: 50%; }
  .toggle { width: 34px; height: 19px; border-radius: 10px; position: relative; }
  .toggle::after { content: ''; position: absolute; width: 13px; height: 13px; border-radius: 50%; background: #fff; top: 3px; left: 17px; }
  .input { font-size: 12px; padding: 5px 10px; border-radius: 8px; width: 130px; }
  .floatcard { border-radius: 10px; padding: 10px 12px; font-size: 11.5px; width: 200px; margin-top: 10px; }
  .floatcard b { display: block; margin-bottom: 3px; }
  .anno { font-size: 11px; color: #6d717d; margin-top: 6px; line-height: 1.5; }
  .anno b { color: #98a0b3; }
</style>
</head>
<body>
<h1>深度系统与选中系统 · Before / After</h1>
<p class="desc">
左 = 现状（那波"加质感"的遗产）：终端 inset 高光、最大化 pane 30px 辉光、SSH 状态点橙色辉光、色板选中 8px 辉光、tab 16px 胶囊圆角、12.5px 字号——处处发亮、处处描边。<br>
右 = 目标态：surface 用同色相明度阶梯表达层级（terminal 配色派生），全应用只保留 1 处真投影（浮层），终端/tab/卡片零投影 + 1px hairline 收边，选中/激活统一为 tonal 填充，focus 用 2px 焦点环，hover 一律 0.12s。
</p>
<div class="schemes" id="schemes"></div>
<div class="row">
  <div class="col" id="colBefore"></div>
  <div class="col" id="colAfter"></div>
</div>
<script>
const SCHEMES = {
  OneHalfDark: { bg: '#282c34', fg: '#abb2bf', accent: '#61afef' },
  Snazzy:      { bg: '#282a36', fg: '#eff0eb', accent: '#ff6ac1' },
  TokyoNight:  { bg: '#1a1b26', fg: '#c0caf5', accent: '#7aa2f7' },
  Catppuccin:  { bg: '#1e1e2e', fg: '#cdd6f4', accent: '#f5c2e7' },
};
const FIXED = { win: '#12141b', tabhover: 'rgba(255,255,255,0.05)', float: '#2a303e' };
const hex2hsl = (hex) => {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) { if (mx === r) h = ((g - b) / d + 6) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; }
  const l = (mx + mn) / 2, s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  return [h, s, l];
};
const hsl2hex = (h, s, l) => {
  const f = (n) => {
    const k = (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const v = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(v * 255).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(8) + f(4);
};
const derive = (bg, lT, sMin = 0.06) => { const [h, s] = hex2hsl(bg); return hsl2hex(h, Math.max(s, sMin), lT); };
const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
};
let cur = 'OneHalfDark';

function render(colEl, after) {
  const s = SCHEMES[cur];
  const accent = after ? s.accent : '#9CA3FF';
  const winBg    = after ? derive(s.bg, 0.065) : FIXED.win;
  const termBg   = s.bg;
  const tabIdle  = after ? 'transparent' : 'transparent';
  const tabHover = after ? rgba('#ffffff', 0.06) : FIXED.tabhover;
  const tabActive = after ? rgba(s.accent, 0.16) : 'rgba(97,175,239,0.24)';
  const radiusTab = after ? 8 : 16;
  const fsTab = after ? 12 : 12.5;
  const termShadow = after
    ? 'inset 0 0 0 1px rgba(255,255,255,0.06)'
    : 'inset 0 1px 0 rgba(255,255,255,0.05)';
  const radiusTerm = after ? 12 : 14;
  const paneMaxShadow = after
    ? 'inset 0 0 0 1px ' + rgba(s.accent, 0.4)
    : 'inset 0 0 0 1px rgba(151,194,255,0.15), 0 0 30px rgba(0,0,0,0.3)';
  const sshDot = after ? '#ffb74d' : '';
  const sshShadow = after ? 'none' : '0 0 8px rgba(255,183,77,0.5)';
  const floatBg = after ? derive(s.bg, 0.185) : FIXED.float;
  const floatShadow = after
    ? '0 12px 32px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.06)'
    : '0 8px 24px rgba(0,0,0,0.45)';
  const swatchSel = after ? `inset 0 0 0 2px ${rgba(s.accent, 0.9)}` : '0 0 8px currentColor';
  const focusRing = `0 0 0 2px ${rgba(s.accent, 0.5)}`;
  const hoverT = after ? '0.12s' : '0.15s';

  colEl.innerHTML = `
  <h2>${after ? 'After' : 'Before'} <span class="tag">${after ? 'tonal 阶梯 · 阴影预算 · 统一选中' : '当前代码的真实值'}</span></h2>
  <div class="win" style="background:${winBg}">
    <div class="titlebar" style="color:${s.fg}aa"><span class="dot" style="background:${accent}"></span>ZTerm — ${cur}</div>
    <div class="tabbar" style="background:${winBg}">
      <span class="chip" style="background:${tabActive};color:${s.fg};border-radius:${radiusTab}px;font-size:${fsTab}px">● git bash</span>
      <span class="chip" style="background:${tabHover};color:${s.fg}99;border-radius:${radiusTab}px;font-size:${fsTab}px">settings</span>
      <span class="chip" style="background:${tabIdle};color:${s.fg}66;border-radius:${radiusTab}px;font-size:${fsTab}px">+ </span>
    </div>
    <div class="main">
      <div class="term" style="background:${termBg};color:${s.fg};border-radius:${radiusTerm}px;box-shadow:${termShadow}">
        <div><span class="p" style="color:${accent}">➜</span> herdr</div>
        <div style="opacity:.75">│ workspace: myterm  │ agent: opencode ●</div>
        <div><span class="p" style="color:${accent}">➜</span> ▌</div>
      </div>
      <div class="floatcard" style="background:${floatBg};color:${s.fg};box-shadow:${floatShadow};position:absolute;right:16px;bottom:14px">
        <b>SFTP 会话</b><span style="opacity:.75">192.168.41.88 · 已连接</span>
      </div>
    </div>
  </div>
  <div class="anno">${after
    ? '层级 = 明度阶梯（底座 6.5% → 终端 → 浮层 18.5%，同色相）；终端/pane <b>零投影</b>，hairline 收边；浮层是全应用<b>唯一真投影</b>。'
    : '终端 inset 顶光；tab 16px 胶囊 + accent 24% 大浓度填充；浮层重投影 0 8px 24px / 45%。'}</div>

  <h2>选中 / 强调效果样例 <span class="tag">同一批元素，两套系统</span></h2>
  <div class="strip" style="background:${winBg}">
    <span class="st-label">列表项（hover → active → focus 输入框）</span>
    <span class="chip" style="background:${after ? rgba('#ffffff', 0.06) : 'rgba(255,255,255,0.05)'};color:${s.fg};transition:${hoverT}">悬停项</span>
    <span class="chip" style="background:${after ? rgba(s.accent, 0.16) : 'rgba(97,175,239,0.24)'};color:${after ? s.fg : '#eaf3fc'}">选中项</span>
    <span class="input" style="background:${after ? rgba('#ffffff', 0.05) : 'rgba(255,255,255,0.05)'};color:${s.fg};border:none;outline:none;box-shadow:${focusRing}" placeholder="聚焦输入框…">聚焦输入框</span>
    <span class="st-label">状态点 / 色板选中 / 开关</span>
    <span class="dot-ind" style="background:${sshDot || '#ffb74d'};box-shadow:${sshShadow}"></span>
    <span style="font-size:11px;color:${s.fg}88">SSH 状态点${after ? '（纯色无辉光）' : '（橙色辉光 0 0 8px）'}</span>
    <span class="swatch" style="background:${s.accent};box-shadow:${swatchSel}"></span>
    <span class="swatch" style="background:${derive(s.bg, 0.30)};box-shadow:inset 0 0 0 1px rgba(255,255,255,0.15)"></span>
    <span style="font-size:11px;color:${s.fg}88">强调色板${after ? '（2px 焦点环选中）' : '（8px 辉光选中）'}</span>
    <span class="toggle" style="background:${accent}"></span>
    <span style="font-size:11px;color:${s.fg}88">开关 on</span>
    <span class="st-label">最大化 pane 指示（对照终端区外框）</span>
    <span class="chip" style="background:${termBg};color:${s.fg};box-shadow:${paneMaxShadow};border-radius:10px">maximized pane</span>
  </div>
  <div class="anno">${after
    ? '所有交互态一个系统：hover = 白 6%；选中 = accent tonal 16%；focus = 2px accent 50% 焦点环；危险/警示只动色不动影。'
    : 'hover 白 5%、选中 accent 24%、强调靠辉光（橙点 / 色板 / 最大化 pane 各一种）、focus 无规范——四种花样并存。'}</div>`;
}

function renderAll() {
  render(document.getElementById('colBefore'), false);
  render(document.getElementById('colAfter'), true);
  for (const b of document.querySelectorAll('.schemes button')) b.classList.toggle('on', b.dataset.s === cur);
}
const bar = document.getElementById('schemes');
for (const name of Object.keys(SCHEMES)) {
  const b = document.createElement('button');
  b.textContent = name; b.dataset.s = name;
  b.onclick = () => { cur = name; renderAll(); };
  bar.appendChild(b);
}
renderAll();
</script>
</body>
</html>
